name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-14
            cmake_args: -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            artifact: NOVA-LEIM-macOS
          - name: Windows (x64)
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A x64
            artifact: NOVA-LEIM-Windows

    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --config Release --parallel 4

      - name: DSP-Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Paket schnüren (macOS)
        if: runner.os == 'macOS'
        run: |
          ART=build/NovaLeim_artefacts/Release
          mkdir -p dist
          cp -R "$ART/VST3/LEIM.vst3" "$ART/AU/LEIM.component" "$ART/Standalone/LEIM.app" dist/
          codesign --force --deep --sign - dist/LEIM.vst3 dist/LEIM.component dist/LEIM.app
          cp README.md dist/
          ditto -c -k --sequesterRsrc dist "${{ matrix.artifact }}.zip"

      - name: Paket schnüren (Windows)
        if: runner.os == 'Windows'
        run: |
          ART=build/NovaLeim_artefacts/Release
          mkdir -p dist
          cp -R "$ART/VST3/LEIM.vst3" dist/
          cp "$ART/Standalone/LEIM.exe" dist/
          cp README.md dist/
          cd dist && 7z a "../${{ matrix.artifact }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
